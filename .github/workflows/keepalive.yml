# Garde le projet Supabase actif : le forfait gratuit met en pause un projet inactif pendant 7 jours.
# Tous les 3 jours, ce robot fait une petite lecture dans la base (ce qui compte comme une activité).
# L'URL et la clé sont lues dans config.js : rien d'autre à configurer.
name: Garder Supabase actif

on:
  schedule:
    - cron: "17 6 */3 * *"   # tous les 3 jours vers 7h (heure de Paris)
  workflow_dispatch:          # bouton « Run workflow » pour tester à la main

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lecture dans la base Supabase
        run: |
          URL=$(grep -oP 'SUPABASE_URL:\s*"\K[^"]+' config.js)
          KEY=$(grep -oP 'SUPABASE_ANON_KEY:\s*"\K[^"]+' config.js)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "config.js n'est pas rempli"; exit 1; fi
          curl -fsS "$URL/rest/v1/races?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
          echo ""
          echo "Supabase a répondu : projet actif ✅"

      # GitHub désactive les tâches planifiées d'un dépôt sans activité depuis 60 jours.
      # Une fois par mois, on met à jour un petit fichier pour que le dépôt reste « actif ».
      - name: Activité mensuelle du dépôt
        run: |
          # le 1er du mois (le planning passe toujours ce jour-là) ou lors d'un lancement manuel
          if [ "$(date -u +%d)" != "01" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then echo "Pas aujourd'hui"; exit 0; fi
          date -u +"%Y-%m-%d %H:%M UTC" > .github/derniere-verification.txt
          git config user.name "keepalive-bot"
          git config user.email "keepalive-bot@users.noreply.github.com"
          git add .github/derniere-verification.txt
          git commit -m "Vérification automatique Supabase" || echo "Rien à enregistrer"
          git push
